name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ── Static analysis and unit tests. No secrets, so this runs on forks too. ──
  verify:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      # The Prisma client is generated code that the backend imports; without
      # it, type checking and tests fail on a clean clone.
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Backend unit tests
        run: npm run test:backend

      - name: Frontend unit tests
        run: npm run test:frontend

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # A build-time placeholder: Clerk validates the key's shape, and no
          # real key is needed to compile.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_PUBLIC_API_URL: http://localhost:5000

  # ── End-to-end. Needs real Clerk, Postgres and Groq credentials, so it is
  #    skipped automatically on forks and wherever the secrets aren't set. ──
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:5000
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Skip when credentials are unavailable
        id: guard
        run: |
          if [ -z "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            echo "E2E secrets are not configured; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm run install:all

      - name: Apply database migrations
        if: steps.guard.outputs.run == 'true'
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        if: steps.guard.outputs.run == 'true'
        run: npm run e2e:install

      - name: Provision the test account
        if: steps.guard.outputs.run == 'true'
        run: node scripts/create-e2e-user.mjs

      - name: Run end-to-end tests
        if: steps.guard.outputs.run == 'true'
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.run == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.artifacts/
          retention-days: 7
